<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Lockpick Pro</title>
<style>
  :root { --fg:#fff; --dim:#8a8a8a; --line:#4a4a4a; }
  * { box-sizing: border-box; border-radius:0; }
  html, body { margin:0; height:100%; background:#000; color:var(--fg);
    font:14px/1.5 ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace; user-select:none; -webkit-user-select:none; touch-action:none; }
  #app { max-width:720px; margin:0 auto; padding:10px 16px 16px; display:flex; flex-direction:column; min-height:100%; }
  #hud { display:flex; flex-wrap:wrap; gap:2px 20px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line);
    text-transform:uppercase; color:var(--dim); }
  #hud span b { color:var(--fg); font-weight:400; margin-left:6px; }
  #hud .grow { flex:1; }
  button { font:inherit; text-transform:uppercase; color:var(--fg); background:#000; border:0; padding:0 4px; cursor:pointer; }
  button::before { content:"[ "; color:var(--dim); }
  button::after { content:" ]"; color:var(--dim); }
  button:hover:not(:disabled) { background:var(--fg); color:#000; }
  button:hover:not(:disabled)::before, button:hover:not(:disabled)::after { color:#000; }
  button:disabled { color:var(--line); cursor:default; }
  button:disabled::before, button:disabled::after { color:var(--line); }
  #stage { position:relative; flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  canvas { width:100%; max-width:600px; aspect-ratio:1; height:auto; display:block; touch-action:none; }
  #turn { display:none; position:absolute; bottom:6px; right:6px; padding:12px 8px; }
  @media (pointer:coarse) { #turn { display:block; } }
  #help { color:var(--dim); font-size:12px; margin-top:4px; border-top:1px solid var(--line); padding-top:6px; }
  #help b { color:var(--fg); font-weight:400; }
  #shop { position:fixed; inset:0; background:#000; display:none; align-items:center; justify-content:center; padding:16px; z-index:5; }
  #shop.open { display:flex; }
  #shopbox { border:1px solid var(--fg); padding:16px 18px; width:100%; max-width:480px; }
  #shopbox h2 { margin:0 0 6px; font-size:14px; font-weight:400; text-transform:uppercase; }
  #shopbox h2::before { content:"> "; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
  .row small { color:var(--dim); display:block; font-size:12px; }
  .btns { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span>Gold <b id="hGold">0</b></span>
    <span>Picks <b id="hPicks">5</b></span>
    <span>Security <b id="hSec">20</b></span>
    <span style="display:none">Max lock <b id="hCap">25</b></span>
    <span id="hPrestWrap">Prestige <b id="hPrest">0</b></span>
    <span class="grow"></span>
    <button id="shopBtn">Shop</button>
  </div>
  <div id="stage">
    <canvas id="cv" width="1200" height="1200"></canvas>
    <button id="turn">Turn</button>
  </div>
  <div id="help">Move the mouse to angle the lockpick &middot; hold <b>A</b> or <b>D</b> to turn the lock (both together = 2x speed) &middot; <b>&larr; &rarr;</b> also move the pick &middot; <b>Esc</b> closes the shop</div>
</div>

<div id="shop">
  <div id="shopbox">
    <h2>Shop</h2>
    <div>Gold: <b id="sGold"></b></div>
    <div class="row"><div>Lockpick<small id="sPickInfo"></small></div><div class="btns"><button id="buyPick"></button><button id="buyPick5"></button></div></div>
    <div class="row"><div>Security skill<small id="sSecInfo"></small></div><div class="btns"><button id="buySec"></button><button id="buySec10"></button></div></div>
    <div class="row"><div>Prestige<small id="sPrestInfo"></small></div><div class="btns"><button id="prestige"></button></div></div>
    <div style="text-align:right;margin-top:10px"><button id="closeShop">Close</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
// ---------- tunables ----------
const START_PICKS = 5, START_SEC = 20, MAX_SEC = 100;
const PICK_COST = 30, PICK_HP = 100, JAM_DMG = 55;       // HP lost per second while jammed
const TURN_SPEED = 100, RETURN_SPEED = 240;              // degrees per second
const LEVEL_CAP_START = 25;
const PRESTIGE_BONUS = 0.25;                              // +25% gold per prestige
const secCost = s => Math.round(20 * Math.pow(1.045, s - START_SEC));  // cost to go from s to s+1
const reward = lvl => Math.round((5 + lvl * 1.5) * (1 + PRESTIGE_BONUS * S.prestige));

// ---------- state ----------
const S = { gold:0, picks:START_PICKS, sec:START_SEC, prestige:0, opened:0 };
const SAVE_KEY = 'lockpickPro.v1';
try { Object.assign(S, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) {}
const save = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} };

let lock;            // {level, sweet, width}
let phi = 90;        // pick angle, degrees (0 = left, 180 = right)
let theta = 0;       // lock rotation, degrees clockwise
let hp = PICK_HP;
let mode = 'play';   // play | opening | broken
let modeT = 0, jammed = false, shopOpen = false, msg = '', msgT = 0;
const floaters = [];
const keys = { a:false, d:false, touch:false, left:false, right:false };
const turnPower = () => (keys.a ? 1 : 0) + (keys.d ? 1 : 0) + (keys.touch ? 1 : 0);  // A+D together = 2x speed

function sweetWidth(level) {                  // full width of sweet spot in degrees
  const diff = level - S.sec;
  return diff <= 0 ? Math.min(60, 24 - diff * 0.35) : Math.max(3, 24 - diff * (21 / 80));
}
// highest possible Lock Level: starts at 25, +3 per 2 locks opened, up to 100 (resets on prestige)
const levelCap = () => Math.min(100, LEVEL_CAP_START + Math.floor(S.opened * 1.5));
function newLock() {
  const level = 1 + Math.floor(Math.random() * levelCap());
  lock = { level, sweet: 8 + Math.random() * 164, width: sweetWidth(level) };
  theta = 0; jammed = false; mode = 'play';
}
function maxTurn() {
  const d = Math.abs(phi - lock.sweet) - lock.width / 2;
  if (d <= 0) return 90;
  return Math.max(5, 75 * (1 - d / 50));
}
function say(t) { msg = t; msgT = 2.5; }
function difficulty() {
  const d = lock.level - S.sec;
  return d <= -20 ? 'Trivial' : d <= 0 ? 'Easy' : d <= 20 ? 'Moderate' : d <= 45 ? 'Hard' : d <= 65 ? 'Very Hard' : 'Brutal';
}

function ensurePick() {
  if (S.picks <= 0 && S.gold < PICK_COST) { S.picks = 1; say('A stranger lends you a lockpick.'); }
}
function breakPick() {
  S.picks--; mode = 'broken'; modeT = 0.8; jammed = false; say('Lockpick broke!'); save();
}

// ---------- update ----------
function update(dt) {
  if (msgT > 0) msgT -= dt;
  for (const f of floaters) { f.t += dt; }
  while (floaters.length && floaters[0].t > 1.4) floaters.shift();
  if (shopOpen) return;

  if (mode === 'broken') {
    modeT -= dt;
    if (modeT <= 0) { ensurePick(); hp = PICK_HP; theta = 0; if (S.picks > 0) mode = 'play'; }
    else theta = Math.max(0, theta - RETURN_SPEED * dt);
    return;
  }
  if (mode === 'opening') {
    modeT -= dt;
    theta = Math.min(90, theta + 200 * dt);
    if (modeT <= 0) newLock();
    return;
  }
  if (S.picks <= 0) { ensurePick(); if (S.picks <= 0) return; hp = PICK_HP; }

  if (theta < 1) {                            // pick can only be moved while the lock is at rest
    const k = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (k) phi = Math.max(0, Math.min(180, phi + k * 90 * dt));
  }
  const power = Math.min(2, turnPower());
  if (power) {
    const lim = maxTurn();
    theta += TURN_SPEED * power * dt;
    if (theta >= 90 && lim >= 90) {           // success
      theta = 90; mode = 'opening'; modeT = 0.8;
      const g = reward(lock.level); S.gold += g; S.opened++;
      floaters.push({ t:0, text:'+' + g + ' gold' }); save();
    } else if (theta >= lim) {
      theta = lim; jammed = true;
      hp -= JAM_DMG * dt;
      if (hp <= 0) breakPick();
    } else jammed = false;
  } else {
    jammed = false;
    theta = Math.max(0, theta - RETURN_SPEED * dt);
  }
}

// ---------- drawing ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = 600, CX = 300, CY = 330, R = 190, KH = 26;   // logical size, lock centre/radius, keyhole top offset
const rad = d => d * Math.PI / 180;

const FONT = 'ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace';
// Shapes are drawn on a coarse 300x300 buffer, alpha-thresholded (no anti-aliasing) and scaled up
// without smoothing, so every edge is a hard, chunky stair-step. Text is drawn crisp on top.
const GS = 300;
const gfx = document.createElement('canvas'); gfx.width = gfx.height = GS;
const g = gfx.getContext('2d', { willReadFrequently: true });

function drawShapes(sx, sy) {
  g.setTransform(GS / W, 0, 0, GS / W, 0, 0);
  g.clearRect(0, 0, W, W);

  // range scale across the top half
  g.strokeStyle = '#fff'; g.lineWidth = 4;
  for (let a = 0; a <= 180; a += 10) {
    const big = a % 90 === 0, r0 = R + 6, r1 = R + (big ? 30 : 16);
    const dx = -Math.cos(rad(a)), dy = -Math.sin(rad(a));
    g.beginPath(); g.moveTo(CX + dx * r0, CY + dy * r0); g.lineTo(CX + dx * r1, CY + dy * r1); g.stroke();
  }

  // rotating cylinder
  g.save();
  g.translate(CX + sx, CY + sy); g.rotate(rad(theta));
  g.strokeStyle = '#fff'; g.lineWidth = 10;
  g.beginPath(); g.arc(0, 0, R - 10, 0, 7); g.stroke();
  g.lineWidth = 6;
  g.beginPath(); g.arc(0, 0, R - 40, 0, 7); g.stroke();
  for (let a = 0; a < 360; a += 90) {
    g.beginPath(); g.moveTo(Math.cos(rad(a)) * (R - 40), Math.sin(rad(a)) * (R - 40));
    g.lineTo(Math.cos(rad(a)) * (R - 10), Math.sin(rad(a)) * (R - 10)); g.stroke();
  }
  // keyhole
  // one merged silhouette: stroke the whole shape wide, then fill it black so only a clean outer outline remains
  const hole = () => {
    g.beginPath(); g.arc(0, -KH + 4, 20, 0, 7);
    g.moveTo(-12, -KH + 12); g.lineTo(-18, 62); g.lineTo(18, 62); g.lineTo(12, -KH + 12); g.closePath();
  };
  g.strokeStyle = '#fff'; g.lineWidth = 12; g.lineJoin = 'miter';
  hole(); g.stroke();
  g.fillStyle = '#000';
  g.beginPath(); g.arc(0, -KH + 4, 20, 0, 7); g.fill();       // fill the two shapes separately so overlapping
  g.beginPath(); g.moveTo(-12, -KH + 12); g.lineTo(-18, 62); g.lineTo(18, 62); g.lineTo(12, -KH + 12); g.closePath(); g.fill();  // windings can't cancel
  g.restore();

  // lockpick: base follows the keyhole top as the lock turns, angle stays fixed on screen
  if (S.picks > 0 || mode === 'broken') {
    const broken = mode === 'broken';
    const dmg = 1 - Math.max(0, hp) / PICK_HP;
    g.save();
    g.translate(CX + sx + KH * Math.sin(rad(theta)), CY + sy - KH * Math.cos(rad(theta)));
    g.rotate(rad(phi - 90));
    const len = broken ? 255 * .55 : 255;
    if (broken) g.translate((Math.random() - .5) * 6, 0);
    const v = Math.round(255 * (1 - dmg * .6));
    g.fillStyle = `rgb(${v},${v},${v})`;
    g.fillRect(-12, -len, 24, len);
    g.restore();
  }

  // 1-bit edges
  const im = g.getImageData(0, 0, GS, GS), d = im.data;
  for (let i = 3; i < d.length; i += 4) d[i] = d[i] > 127 ? 255 : 0;
  g.putImageData(im, 0, 0);
}

function draw() {
  let sx = 0, sy = 0;
  if (jammed) { sx = (Math.random() - .5) * 8; sy = (Math.random() - .5) * 8; }
  drawShapes(sx, sy);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(gfx, 0, 0, cv.width, cv.height);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / W, 0, 0);

  // text
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = '16px ' + FONT;
  ctx.fillText('> LOCK LEVEL ' + lock.level, 20, 30);
  ctx.fillStyle = '#8a8a8a'; ctx.font = '14px ' + FONT;
  ctx.fillText('  ' + difficulty().toUpperCase() + ', REWARD ' + reward(lock.level), 20, 52);

  // pick health: solid bar
  const bw = 240, bx = 330, by = 556, bh = 20, f = Math.max(0, hp) / PICK_HP;
  const blink = f < .3 && mode === 'play' && Math.sin(performance.now() / 80) > 0;
  ctx.fillStyle = '#fff'; ctx.font = '14px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText('PICK', bx - 12, by + 15);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = blink ? '#8a8a8a' : '#fff';
  ctx.fillRect(bx + 8, by + 8, Math.round((bw - 16) * f), bh - 16);

  const line = msgT > 0 ? msg : (S.picks <= 0 ? 'Out of lockpicks - visit the shop' : '');
  if (line) {
    ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = '16px ' + FONT;
    ctx.fillText('! ' + line.toUpperCase(), 20, 80);
  }
  ctx.textAlign = 'center';
  for (const fl of floaters) {
    ctx.globalAlpha = Math.max(0, 1 - fl.t / 1.4);
    ctx.fillStyle = '#fff'; ctx.font = '24px ' + FONT;
    ctx.fillText(fl.text, CX, CY - 40 - fl.t * 60);
    ctx.globalAlpha = 1;
  }
}

// ---------- HUD / shop ----------
const $ = id => document.getElementById(id);
let prestigeArm = false;
function refreshUI() {
  $('hGold').textContent = S.gold; $('hPicks').textContent = S.picks;
  $('hSec').textContent = S.sec; $('hPrest').textContent = S.prestige; $('hCap').textContent = levelCap();
  $('sGold').textContent = S.gold;
  $('sPickInfo').textContent = 'Owned: ' + S.picks + ' – each has ' + PICK_HP + ' HP';
  $('buyPick').textContent = '1 for ' + PICK_COST; $('buyPick').disabled = S.gold < PICK_COST;
  $('buyPick5').textContent = '5 for ' + PICK_COST * 5; $('buyPick5').disabled = S.gold < PICK_COST * 5;
  const maxed = S.sec >= MAX_SEC;
  $('sSecInfo').textContent = 'Level ' + S.sec + ' / ' + MAX_SEC + ' – bigger sweet spots';
  let c1 = maxed ? 0 : secCost(S.sec), c10 = 0;
  for (let s = S.sec, i = 0; s < MAX_SEC && i < 10; s++, i++) c10 += secCost(s);
  $('buySec').textContent = maxed ? 'Maxed' : '+1 for ' + c1; $('buySec').disabled = maxed || S.gold < c1;
  $('buySec10').textContent = maxed ? '' : '+10 for ' + c10; $('buySec10').style.display = maxed ? 'none' : '';
  $('buySec10').disabled = maxed || S.gold < c10;
  $('sPrestInfo').textContent = 'Prestige ' + S.prestige + ' (+' + Math.round(PRESTIGE_BONUS * 100 * S.prestige) +
    '% gold). At Security 100: reset Security to ' + START_SEC + ', gold to 0 and max lock level to ' + LEVEL_CAP_START + ', gain +' + Math.round(PRESTIGE_BONUS * 100) + '% gold.';
  $('prestige').disabled = S.sec < MAX_SEC;
  $('prestige').textContent = prestigeArm ? 'Confirm?' : 'Prestige';
}
function buySec(n) {
  while (n-- > 0 && S.sec < MAX_SEC && S.gold >= secCost(S.sec)) { S.gold -= secCost(S.sec); S.sec++; }
  lock.width = sweetWidth(lock.level);       // current lock benefits immediately
  save(); refreshUI();
}
function openShop(o) {
  shopOpen = o; prestigeArm = false;
  $('shop').classList.toggle('open', o);
  keys.a = keys.d = keys.touch = false; refreshUI();
  if (!o && S.picks <= 0) ensurePick();
}
$('shopBtn').onclick = () => openShop(true);
$('closeShop').onclick = () => openShop(false);
$('buyPick').onclick = () => { if (S.gold >= PICK_COST) { S.gold -= PICK_COST; S.picks++; save(); refreshUI(); } };
$('buyPick5').onclick = () => { if (S.gold >= PICK_COST * 5) { S.gold -= PICK_COST * 5; S.picks += 5; save(); refreshUI(); } };
$('buySec').onclick = () => buySec(1);
$('buySec10').onclick = () => buySec(10);
$('prestige').onclick = () => {
  if (S.sec < MAX_SEC) return;
  if (!prestigeArm) { prestigeArm = true; refreshUI(); return; }
  S.prestige++; S.sec = START_SEC; S.gold = 0; S.opened = 0; prestigeArm = false;
  lock.width = sweetWidth(lock.level); save(); refreshUI(); openShop(false);
  say('Prestige ' + S.prestige + '! Security reset.');
};

// ---------- input ----------
function setPhiFromPointer(e) {
  if (theta >= 1 || shopOpen) return;
  const r = cv.getBoundingClientRect();
  const t = (e.clientX - r.left) / r.width;
  phi = Math.max(0, Math.min(180, (t - 0.12) / 0.76 * 180));
}
window.addEventListener('pointermove', setPhiFromPointer);
cv.addEventListener('pointerdown', setPhiFromPointer);
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'escape' && shopOpen) { openShop(false); return; }
  if (shopOpen) return;
  if (k === 'a' || k === 'd') { keys[k] = true; e.preventDefault(); }
  else if (k === 'arrowleft') { keys.left = true; e.preventDefault(); }
  else if (k === 'arrowright') { keys.right = true; e.preventDefault(); }
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'a' || k === 'd') keys[k] = false;
  else if (k === 'arrowleft') keys.left = false;
  else if (k === 'arrowright') keys.right = false;
});
window.addEventListener('blur', () => { keys.a = keys.d = keys.touch = keys.left = keys.right = false; });
const tb = $('turn');
tb.addEventListener('pointerdown', e => { keys.touch = true; tb.setPointerCapture(e.pointerId); e.stopPropagation(); });
['pointerup', 'pointercancel'].forEach(n => tb.addEventListener(n, () => { keys.touch = false; }));

// ---------- loop ----------
function fit() {
  const s = Math.min(1200, Math.max(300, Math.round(cv.clientWidth * (window.devicePixelRatio || 1) / 300) * 300));  // multiple of the 300px shape buffer
  if (s > 0 && cv.width !== s) { cv.width = cv.height = s; }
}
window.addEventListener('resize', fit);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  if (!shopOpen) { $('hGold').textContent = S.gold; $('hPicks').textContent = S.picks; $('hSec').textContent = S.sec; $('hPrest').textContent = S.prestige; $('hCap').textContent = levelCap(); }
  requestAnimationFrame(frame);
}
newLock(); ensurePick(); fit(); refreshUI();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
